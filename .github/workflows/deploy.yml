name: Deploy Guobo Guide to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare image processing
        run: python -m pip install --disable-pip-version-check pillow
      - name: Cache and validate relic photographs
        run: python scripts/cache_artifact_images.py
      - name: Validate published site assets
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          report=json.loads((root/'assets/image-status.json').read_text())
          assert report['cached'] >= 22, report
          for src in report['images'].values():
              p=root/src
              assert p.is_file() and p.stat().st_size>1200, src
          assert 'assets/image-map.js' in (root/'index.html').read_text()
          print('PASS: validated',report['cached'],'local images')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
